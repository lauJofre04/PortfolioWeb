<section id="estudios" class="scroll-mt-24 px-4 py-16">
  <div class="mx-auto max-w-6xl">
    <div class="mb-10 flex items-end justify-between gap-4">
      <div>
        <span class="font-mono text-xs font-semibold uppercase tracking-widest text-[var(--primary)]">// 03. Education</span>
        <h2 class="mt-1 text-3xl font-extrabold text-[var(--texto)] sm:text-4xl">{{ 'SECTIONS.EDUCATION' | translate }}</h2>
        <p class="mt-2 text-[var(--texto-secundario)]">{{ 'EDUCATION.SUBTITLE' | translate }}</p>
      </div>
      <button *ngIf="esAdmin" class="rounded-xl border border-[var(--border)] bg-[var(--card-bg)] px-4 py-2.5 text-sm font-bold text-[var(--texto)]" (click)="limpiarFormulario()">+ Agregar</button>
    </div>

    <div class="relative ml-3 space-y-8 border-l-2 border-[var(--border)] pl-7 sm:ml-4 sm:pl-10">
      <article *ngFor="let estudio of misEstudios; let i = index" class="relative">
        <span class="absolute -left-[37px] top-6 h-4 w-4 rounded-full ring-4 sm:-left-[49px]" [ngClass]="i % 2 === 0 ? 'bg-emerald-500 ring-emerald-500/20' : 'bg-[var(--primary)] ring-indigo-500/20'"></span>
        <div class="rounded-2xl border border-[var(--border)] bg-[var(--card-bg)] p-5 sm:p-6">
          <div class="flex flex-wrap items-start justify-between gap-3">
            <div>
              <h3 class="text-lg font-bold text-[var(--texto)]">{{ estudio.titulo }}</h3>
              <p class="mt-1 text-sm font-medium text-[var(--primary)]">{{ estudio.institucion }}</p>
              <p *ngIf="estudio.descripcion" class="mt-3 text-sm text-[var(--texto-secundario)]">{{ estudio.descripcion }}</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="rounded-full border border-[var(--primary)]/30 bg-[var(--primary)]/10 px-3 py-1 font-mono text-xs text-[var(--primary)]">{{ estudio.fecha_inicio | date:'yyyy' }}</span>
              <div *ngIf="esAdmin" class="flex gap-2">
                <button (click)="cargarDatosParaEditar(estudio)" class="text-amber-500">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button (click)="borrarEstudios(estudio.id)" class="text-red-500">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </article>
    </div>
  </div>

  <div *ngIf="showStudyModal" class="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
    <div class="w-full max-w-md rounded-2xl border border-[var(--border)] bg-[var(--card-bg)] p-5 shadow-2xl">
      <div class="mb-4 flex justify-between">
        <h5 class="font-bold">{{ esEdicion ? 'Editar Estudio' : 'Nuevo Estudio' }}</h5>
        <button (click)="closeStudyModal()">✕</button>
      </div>
      <form (ngSubmit)="guardarCambios()" class="space-y-3">
        <input class="form-input w-full" [(ngModel)]="formEstudio.titulo" name="titulo" placeholder="Título">
        <input class="form-input w-full" [(ngModel)]="formEstudio.institucion" name="institucion" placeholder="Institución">
        <textarea class="form-input w-full resize-none" [(ngModel)]="formEstudio.descripcion" name="descripcion" rows="3" placeholder="Descripción"></textarea>
        <input type="date" class="form-input w-full" [(ngModel)]="formEstudio.fecha_inicio" name="fecha_inicio">
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" class="rounded-xl border border-[var(--border)] px-4 py-2" (click)="closeStudyModal()">Cancelar</button>
          <button type="submit" class="rounded-xl bg-[var(--primary)] px-4 py-2 text-white">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</section>
