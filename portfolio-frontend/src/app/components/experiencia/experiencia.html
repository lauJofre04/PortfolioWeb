<section id="experiencia" class="mx-auto mb-5 pt-20 -mt-20 px-4">

  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">{{ 'SECTIONS.EXPERIENCE' | translate }}</h2>
    <button *ngIf="esAdmin" class="bg-green-600 text-white rounded-full px-4 shadow font-bold" (click)="limpiarFormulario(); openExperienceModal()">+ Agregar</button>
  </div>

  <div class="flex flex-col gap-4">
    <div *ngFor="let exp of miExperiencia" class="mb-4">
      <div class="bg-[var(--card-bg)] border border-[var(--border)] shadow-sm rounded-2xl">
        <div class="p-3 md:p-4 flex flex-col md:flex-row items-center gap-4">

          <div *ngIf="exp.logo_url" class="text-center md:text-left md:w-1/6">
            <img [src]="exp.logo_url" alt="Logo {{ exp.empresa }}" class="w-20 h-20 rounded-lg bg-white p-2 shadow-sm object-contain">
          </div>

          <div [class]="exp.logo_url ? 'w-full md:w-4/6' : 'w-full md:w-5/6'">
            <div class="flex flex-col md:flex-row md:items-center gap-2 mb-2">
              <h5 class="text-lg font-bold text-[var(--texto)] mb-0">{{ exp.puesto }}</h5>
              <span class="bg-[var(--primary)] text-white rounded-full px-3 py-1 text-sm">{{ exp.fecha_inicio | date:'MMM yyyy' }} - {{ exp.fecha_fin ? (exp.fecha_fin | date:'MMM yyyy') : 'Actualidad' }}</span>
            </div>
            <h6 class="mb-3 text-[var(--primary)] font-bold">{{ exp.empresa }}</h6>
            <p class="text-[var(--texto)] mb-0" style="opacity:0.9">{{ exp.descripcion }}</p>
          </div>

          <div class="w-full md:w-1/6 flex justify-start md:justify-end gap-2 mt-3 md:mt-0" *ngIf="esAdmin">
            <button class="p-2 text-yellow-500" (click)="cargarDatosParaEditar(exp); openExperienceModal()" title="Editar">
              <i class="bi bi-pencil-square fs-5"></i>
            </button>
            <button class="p-2 text-red-500" (click)="borrarExperiencia(exp.id)" title="Borrar">
              <i class="bi bi-trash fs-5"></i>
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

</section>

<!-- Experiencia Modal -->
<div *ngIf="showExperienceModal" class="fixed inset-0 flex items-center justify-center bg-black/50 z-50">
  <div class="bg-[var(--card-bg)] rounded-2xl p-4 w-full max-w-2xl shadow-lg">
    <div class="flex justify-between items-center mb-4">
      <h5 class="font-bold">{{ esEdicion ? 'Editar Experiencia' : 'Nueva Experiencia' }}</h5>
      <button (click)="closeExperienceModal()">✕</button>
    </div>

    <form (ngSubmit)="guardarCambios()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="text-sm text-muted">PUESTO</label>
          <input type="text" class="form-input w-full p-2 rounded" [(ngModel)]="formExp.puesto" name="puesto">
        </div>
        <div>
          <label class="text-sm text-muted">EMPRESA</label>
          <input type="text" class="form-input w-full p-2 rounded" [(ngModel)]="formExp.empresa" name="empresa">
        </div>
        <div>
          <label class="text-sm text-muted">FECHA INICIO</label>
          <input type="date" class="form-input w-full p-2 rounded" [(ngModel)]="formExp.fecha_inicio" name="fecha_inicio">
        </div>
        <div>
          <label class="text-sm text-muted">FECHA FIN</label>
          <input type="date" class="form-input w-full p-2 rounded" [(ngModel)]="formExp.fecha_fin" name="fecha_fin">
        </div>
        <div class="md:col-span-2">
          <label class="text-sm text-muted">URL DE LA IMAGEN / LOGO</label>
          <input type="text" class="form-input w-full p-2 rounded" [(ngModel)]="formExp.logo_url" name="logo_url" placeholder="https://ejemplo.com/logo.jpg">
        </div>
        <div class="md:col-span-2">
          <label class="text-sm text-muted">DESCRIPCIÓN</label>
          <textarea class="form-input w-full p-2 rounded" [(ngModel)]="formExp.descripcion" name="descripcion" rows="3"></textarea>
        </div>
      </div>

      <div class="mt-4 flex justify-between">
        <button type="button" class="px-4 py-2 rounded border" (click)="closeExperienceModal()">Cancelar</button>
        <button type="submit" class="px-4 py-2 rounded bg-[var(--primary)] text-white">{{ esEdicion ? 'Guardar Cambios' : 'Agregar' }}</button>
      </div>
    </form>
  </div>
</div>
