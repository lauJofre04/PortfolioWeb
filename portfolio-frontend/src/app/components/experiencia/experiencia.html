<section id="experiencia" class="scroll-mt-24 px-4 py-16">
  <div class="mx-auto max-w-6xl">
    <div class="mb-8 flex items-end justify-between gap-4">
      <div>
        <span class="font-mono text-xs font-semibold uppercase tracking-widest text-[var(--primary)]">// 04. Experience</span>
        <h2 class="mt-1 text-3xl font-extrabold text-[var(--texto)] sm:text-4xl">{{ 'SECTIONS.EXPERIENCE' | translate }}</h2>
      </div>
      <button *ngIf="esAdmin" class="rounded-xl border border-[var(--border)] bg-[var(--card-bg)] px-4 py-2.5 text-sm font-bold text-[var(--texto)]" (click)="limpiarFormulario()">+ Agregar</button>
    </div>
    <div class="grid gap-4">
      <article *ngFor="let exp of miExperiencia" class="rounded-2xl border border-[var(--border)] bg-[var(--card-bg)] p-5 sm:p-6">
        <div class="flex flex-col gap-4 md:flex-row md:items-start">
          <img *ngIf="exp.logo_url" [src]="exp.logo_url" [alt]="exp.empresa" class="h-16 w-16 rounded-xl border border-[var(--border)] bg-white object-contain p-2">
          <div class="flex-1">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div>
                <h3 class="text-lg font-bold text-[var(--texto)]">{{ exp.puesto }}</h3>
                <p class="mt-1 text-sm font-medium text-[var(--primary)]">{{ exp.empresa }}</p>
              </div>
              <span class="rounded-full border border-[var(--border)] bg-[var(--fondo)] px-3 py-1 font-mono text-xs text-[var(--texto-secundario)]">
                {{ exp.fecha_inicio | date:'MMM yyyy' }} - {{ exp.fecha_fin ? (exp.fecha_fin | date:'MMM yyyy') : 'Actualidad' }}
              </span>
            </div>
            <p class="mt-4 text-sm leading-relaxed text-[var(--texto-secundario)]">{{ exp.descripcion }}</p>
          </div>
          <div *ngIf="esAdmin" class="flex gap-2">
            <button (click)="cargarDatosParaEditar(exp)" class="text-amber-500">
              <i class="bi bi-pencil-square"></i>
            </button>
            <button (click)="borrarExperiencia(exp.id)" class="text-red-500">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      </article>
    </div>
  </div>

  <div *ngIf="showExperienceModal" class="fixed inset-0 z-[70] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
    <div class="w-full max-w-2xl rounded-2xl border border-[var(--border)] bg-[var(--card-bg)] p-5 shadow-2xl">
      <div class="mb-4 flex justify-between">
        <h5 class="font-bold">{{ esEdicion ? 'Editar Experiencia' : 'Nueva Experiencia' }}</h5>
        <button (click)="closeExperienceModal()">✕</button>
      </div>
      <form (ngSubmit)="guardarCambios()" class="grid gap-3 md:grid-cols-2">
        <input class="form-input w-full" [(ngModel)]="formExp.puesto" name="puesto" placeholder="Puesto">
        <input class="form-input w-full" [(ngModel)]="formExp.empresa" name="empresa" placeholder="Empresa">
        <input type="date" class="form-input w-full" [(ngModel)]="formExp.fecha_inicio" name="fecha_inicio">
        <input type="date" class="form-input w-full" [(ngModel)]="formExp.fecha_fin" name="fecha_fin">
        <input class="form-input w-full md:col-span-2" [(ngModel)]="formExp.logo_url" name="logo_url" placeholder="URL logo">
        <textarea class="form-input w-full resize-none md:col-span-2" [(ngModel)]="formExp.descripcion" name="descripcion" rows="3" placeholder="Descripción"></textarea>
        <div class="flex justify-end gap-2 md:col-span-2">
          <button type="button" class="rounded-xl border border-[var(--border)] px-4 py-2" (click)="closeExperienceModal()">Cancelar</button>
          <button type="submit" class="rounded-xl bg-[var(--primary)] px-4 py-2 text-white">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</section>
