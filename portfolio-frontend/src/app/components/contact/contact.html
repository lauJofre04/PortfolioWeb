<!-- Floating Action Button (FAB) -->
<button 
  (click)="openContactModal()" 
  class="fixed bottom-8 right-8 z-40 w-14 h-14 rounded-full bg-accent hover:bg-accent/90 text-white shadow-lg hover:shadow-xl transition-all duration-300 flex items-center justify-center"
  title="Contacto">
  <i class="bi bi-chat-dots text-xl"></i>
</button>

<!-- Contact Modal -->
<div 
  *ngIf="isContactModalOpen" 
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm"
  (click)="closeContactModal()">
  <div 
    class="card-surface rounded-2xl p-6 md:p-8 w-full max-w-md shadow-2xl"
    (click)="$event.stopPropagation()">

    <!-- Modal Header -->
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-[var(--texto)]">{{ 'CONTACT.TITLE' | translate }}</h2>
      <button 
        (click)="closeContactModal()" 
        class="text-2xl text-[var(--texto-secundario)] hover:text-[var(--texto)] transition">
        ✕
      </button>
    </div>

    <!-- Modal Description -->
    <p class="text-[var(--texto-secundario)] mb-6">{{ 'CONTACT.DESCRIPTION' | translate }}</p>

    <!-- Contact Form -->
    <form (ngSubmit)="submitForm()" class="space-y-4">
      <!-- Name Field -->
      <div>
        <label for="contact-name" class="text-sm uppercase font-bold block mb-2 text-[var(--texto)]">{{ 'CONTACT.LABEL_NAME' | translate }}</label>
        <input
          type="text"
          id="contact-name"
          [(ngModel)]="formData.name"
          name="name"
          autocomplete="name"
          class="w-full form-input placeholder:text-[var(--texto-secundario)]"
          placeholder="{{ 'CONTACT.PLACEHOLDER_NAME' | translate }}"
          required>
      </div>

      <!-- Email Field -->
      <div>
        <label for="contact-email" class="text-sm uppercase font-bold block mb-2 text-[var(--texto)]">{{ 'CONTACT.LABEL_EMAIL' | translate }}</label>
        <input
          type="email"
          id="contact-email"
          [(ngModel)]="formData.email"
          name="email"
          autocomplete="email"
          class="w-full form-input placeholder:text-[var(--texto-secundario)]"
          placeholder="{{ 'CONTACT.PLACEHOLDER_EMAIL' | translate }}"
          required>
      </div>

      <!-- Message Field -->
      <div>
        <label for="contact-message" class="text-sm uppercase font-bold block mb-2 text-[var(--texto)]">{{ 'CONTACT.LABEL_MESSAGE' | translate }}</label>
        <textarea
          id="contact-message"
          [(ngModel)]="formData.message"
          name="message"
          class="w-full form-input placeholder:text-[var(--texto-secundario)] resize-none"
          rows="4"
          placeholder="{{ 'CONTACT.PLACEHOLDER_MESSAGE' | translate }}"
          required></textarea>
      </div>

      <!-- Button Group -->
      <div class="flex gap-3 pt-4">
        <button 
          type="button" 
          (click)="closeContactModal()" 
          class="flex-1 py-2 font-bold rounded-full btn-secondary">
          {{ 'COMMON.CANCEL' | translate }}
        </button>
        <button 
          type="submit" 
          [disabled]="isSubmitting"
          class="flex-1 py-2 font-bold rounded-full btn-primary disabled:opacity-50 disabled:cursor-not-allowed transition">
          {{ isSubmitting ? 'ENVIANDO...' : ('CONTACT.SEND_BUTTON' | translate) }}
        </button>
      </div>
    </form>
  </div>
</div>
