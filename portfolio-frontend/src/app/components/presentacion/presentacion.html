<section id="presentacion" class="w-full flex justify-center items-center px-4 py-20 mt-16 md:py-28 lg:py-32">
  <div class="w-full max-w-5xl">

    <div class="flip-card-wrapper mx-auto w-full h-[420px] md:h-[520px] lg:h-[580px] hover:-translate-y-1 transition-transform duration-300" (click)="isFlipped = !isFlipped">
      <div class="flip-card-inner" [class.is-flipped]="isFlipped">

        <div class="flip-card-front shadow-2xl rounded-[2rem] bg-[var(--fondo-secundario)] flex flex-col items-center justify-center text-center p-6 md:p-10 overflow-hidden">
          
          <h6 class="text-[var(--primary)] font-bold uppercase mb-3 tracking-[0.2em] text-sm md:text-base">{{ presentacionData.titulo }}</h6>
          <h1 class="font-bold mb-4 text-4xl md:text-5xl lg:text-6xl text-[var(--texto)]">{{ presentacionData.nombre }}</h1>
          <hr class="border-[var(--border)] w-24 mx-auto mb-2">
          
          <p class="mb-6 text-base md:text-lg lg:text-xl text-[var(--texto)] leading-relaxed max-w-2xl">
            {{ presentacionData.descripcionCorta }}
          </p>
          
          <span class="text-[var(--primary)] text-sm font-bold mt-3 block">
            <i class="bi bi-arrow-repeat mr-1"></i> {{ 'PRESENTACION.CLICK_HINT' | translate }}
          </span>
          
          <div class="flex flex-col gap-3 sm:flex-row sm:justify-center sm:flex-wrap w-full mt-6">
            <a href="https://www.linkedin.com/in/lautaro-jofre" target="_blank" rel="noreferrer" class="btn-primary w-full sm:w-auto inline-flex items-center justify-center px-5 py-3 rounded-full font-bold transition duration-300 hover:scale-105" (click)="$event.stopPropagation()">LinkedIn</a>
            <a href="https://github.com/lauJofre04" target="_blank" rel="noreferrer" class="btn-secondary w-full sm:w-auto inline-flex items-center justify-center px-5 py-3 rounded-full font-bold transition duration-300 hover:bg-[var(--accent-soft)]" (click)="$event.stopPropagation()">GitHub</a>
            <a href="https://drive.google.com/file/d/1bWvIHJBhc5Q34GrmSl817NVlhUegZXaD/view?usp=drive_link" target="_blank" rel="noreferrer" class="btn-secondary w-full sm:w-auto inline-flex items-center justify-center px-5 py-3 rounded-full font-bold transition duration-300 hover:bg-[var(--accent-soft)]" (click)="$event.stopPropagation()">{{ 'PRESENTACION.DOWNLOAD_CV' | translate }}</a>
          </div>
        </div>

        <div class="flip-card-back shadow-2xl rounded-[2rem] bg-[var(--fondo-secundario)] flex flex-col items-center justify-center text-center p-6 md:p-10 overflow-hidden">
          
          <h3 class="font-bold mb-6 text-[var(--primary)] text-2xl md:text-3xl lg:text-4xl">{{ 'PRESENTACION.TITLE' | translate }}</h3>
          
          <p class="text-base md:text-lg lg:text-xl leading-relaxed text-[var(--texto)] max-w-3xl">
            {{ presentacionData.perfil }}
          </p>
          
          <button class="mt-8 px-6 py-3 w-full sm:w-auto rounded-full btn-secondary font-bold transition duration-300 hover:bg-[var(--accent)] hover:text-white" (click)="$event.stopPropagation()">
            <i class="bi bi-arrow-return-left mr-1"></i> {{ 'PRESENTACION.BACK' | translate }}
          </button>
        </div>

      </div>
    </div>

  </div>
</section>
