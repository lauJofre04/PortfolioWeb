<section id="habilidades" class="container mx-auto mb-5 pt-20 -mt-20 px-4">

  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">{{ 'SECTIONS.SKILLS' | translate }}</h2>
    <button *ngIf="esAdmin" class="btn-primary rounded-full px-4 shadow font-bold" (click)="limpiarFormulario(); openSkillsModal()">
      + Agregar
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div *ngFor="let hab of misHabilidades" class="mb-4">
      <div class="card-surface h-full p-3 flex items-center justify-between rounded-2xl">
        <div class="flex items-center w-3/4">
          <img *ngIf="hab.icono_url" [src]="hab.icono_url" alt="{{ hab.nombre }}" class="w-11 h-11 mr-4 object-contain">
          <div class="w-full pr-3">
            <h6 class="mb-2 font-bold text-[var(--texto)]">{{ hab.nombre }}</h6>
            <div class="w-full bg-[var(--fondo-secundario)] rounded h-2">
              <div class="bg-[var(--primary)] h-2 rounded" [style.width.%]="hab.porcentaje"></div>
            </div>
          </div>
        </div>

        <div class="flex gap-2" *ngIf="esAdmin">
          <button class="p-2 text-yellow-500" (click)="cargarDatosParaEditar(hab); openSkillsModal()" title="Editar">
            <i class="bi bi-pencil-square fs-5"></i>
          </button>
          <button class="p-2 text-red-500" (click)="borrarHabilidad(hab.id)" title="Borrar">
            <i class="bi bi-trash fs-5"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Habilidades Modal -->
<div *ngIf="showSkillsModal" class="fixed inset-0 flex items-center justify-center bg-black/50 z-50">
  <div class="card-surface rounded-2xl p-4 w-full max-w-md shadow-lg">
    <div class="flex justify-between items-center mb-4">
      <h5 class="font-bold">{{ esEdicion ? 'Editar' : 'Nueva' }} Habilidad</h5>
      <button (click)="closeSkillsModal()">✕</button>
    </div>

    <form (ngSubmit)="guardarCambios()">
      <div class="mb-3">
        <label class="small">NOMBRE (Ej: Angular)</label>
        <input type="text" class="form-input w-full p-2 rounded" [(ngModel)]="formHab.nombre" name="nombre">
      </div>
      <div class="mb-3">
        <label class="small">PORCENTAJE (1 al 100)</label>
        <input type="number" class="form-input w-full p-2 rounded" [(ngModel)]="formHab.porcentaje" name="porcentaje">
      </div>
      <div class="mb-3">
        <label class="small">URL DEL ICONO</label>
        <input type="text" class="form-input w-full p-2 rounded" [(ngModel)]="formHab.icono_url" name="icono_url">
      </div>

      <div class="mt-4 flex justify-end gap-2">
        <button type="button" class="px-4 py-2 rounded border" (click)="closeSkillsModal()">Cancelar</button>
        <button type="submit" class="px-4 py-2 rounded bg-[var(--primary)] text-white">Guardar</button>
      </div>
    </form>
  </div>
</div>
