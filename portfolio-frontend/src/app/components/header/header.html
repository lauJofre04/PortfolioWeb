<header class="fixed top-0 left-0 right-0 z-50 bg-[var(--navbar-bg)] text-[var(--navbar-text)] shadow-sm">
    <nav class="container mx-auto max-w-screen-xl px-4 flex flex-wrap items-center justify-between h-16">

        <a class="flex items-center font-bold text-[var(--navbar-text)]" href="#">
            <span class="text-[var(--primary)] mr-2">&lt;/&gt;</span> Lautaro Jofre
        </a>

        <button type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/20 bg-white/10 text-[var(--navbar-text)] transition hover:bg-white/20" (click)="sidebar.toggle()" aria-label="Open sidebar">
            <i class="bi bi-list text-xl"></i>
        </button>

        <div class="flex items-center gap-2">
            <button class="px-3 py-1 rounded-full border border-white/20 bg-white/10 text-[var(--navbar-text)] transition hover:bg-white/20" (click)="toggleTheme()">
                <i class="bi" [class]="isDarkMode ? 'bi-sun' : 'bi-moon'"></i>
                <span class="ml-2 text-sm hidden sm:inline">{{ isDarkMode ? ('THEME.TOGGLE_LIGHT' | translate) : ('THEME.TOGGLE_DARK' | translate) }}</span>
            </button>

            <button class="px-3 py-1 rounded-full border border-white/20 bg-white/10 text-[var(--navbar-text)] transition hover:bg-white/20" (click)="changeLanguage(currentLang === 'es' ? 'en' : 'es')">
                <span class="text-sm">{{ currentLang === 'es' ? ('LANG.ENGLISH' | translate) : ('LANG.SPANISH' | translate) }}</span>
            </button>

            <ng-container *ngIf="!estaLogueado">
                <button class="px-4 py-1 rounded-full btn-secondary font-bold hidden sm:block" (click)="openLogin()">
                    {{ 'NAV.INGRESAR' | translate }}
                </button>
                <button class="px-4 py-1 rounded-full btn-primary font-bold hidden sm:block" (click)="openRegister()">
                    {{ 'NAV.REGISTRARSE' | translate }}
                </button>
            </ng-container>

            <ng-container *ngIf="estaLogueado">
                <button class="px-4 py-1 rounded-full border border-[var(--navbar-text)] font-bold text-[var(--navbar-text)] transition hover:bg-white/10 hidden sm:block" (click)="cerrarSesion()">
                    {{ 'NAV.CERRAR_SESION' | translate }}
                </button>
            </ng-container>
        </div>

    </nav>

    <!-- Login Modal (Angular controlled) -->
    <div *ngIf="showLoginModal" class="fixed inset-0 flex items-center justify-center bg-black/50 z-50">
        <div class="bg-[var(--card-bg)] rounded-2xl p-4 w-full max-w-md shadow-lg">
            <div class="flex justify-end">
                <button (click)="closeModals()" class="text-[var(--texto)]">✕</button>
            </div>
            <div class="text-center pt-0">
                <h4 class="font-bold mb-4 text-[var(--texto)]">{{ 'LOGIN.TITLE' | translate }}</h4>
                <form (ngSubmit)="iniciarSesion()" class="space-y-4">
                    <div class="mb-4 text-start">
                        <label class="font-bold text-muted small mb-1">{{ 'LOGIN.USERNAME_LABEL' | translate }}</label>
                        <input type="text" class="w-full bg-[var(--fondo-secundario)] border-none p-3 rounded-3xl transition duration-300 outline-none focus:ring-2 focus:ring-[var(--primary)] placeholder:text-[var(--texto-secundario)]" [(ngModel)]="credenciales.username" name="username" placeholder="{{ 'LOGIN.USERNAME_PLACEHOLDER' | translate }}">
                    </div>
                    <div class="mb-4 text-start">
                        <label class="font-bold text-muted small mb-1">{{ 'LOGIN.PASSWORD_LABEL' | translate }}</label>
                        <input type="password" class="w-full bg-[var(--fondo-secundario)] border-none p-3 rounded-3xl transition duration-300 outline-none focus:ring-2 focus:ring-[var(--primary)] placeholder:text-[var(--texto-secundario)]" [(ngModel)]="credenciales.password" name="password" placeholder="{{ 'LOGIN.PASSWORD_PLACEHOLDER' | translate }}">
                    </div>
                    <button type="submit" class="w-full px-4 py-2 rounded-full font-bold bg-[#1abc9c] text-white shadow-sm transition hover:brightness-90">{{ 'LOGIN.BUTTON' | translate }}</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Register Modal (Angular controlled) -->
    <div *ngIf="showRegisterModal" class="fixed inset-0 flex items-center justify-center bg-black/50 z-50">
        <div class="bg-[var(--card-bg)] rounded-2xl p-4 w-full max-w-md shadow-lg">
            <div class="flex justify-end">
                <button (click)="closeModals()" class="text-[var(--texto)]">✕</button>
            </div>
            <div class="text-center pt-0">
                <h4 class="font-bold mb-4 text-[var(--texto)]">{{ 'REGISTER.TITLE' | translate }}</h4>
                <form (ngSubmit)="registrarse()" class="space-y-4">
                    <div class="mb-4 text-start">
                        <label class="font-bold text-muted small mb-1">{{ 'REGISTER.USERNAME_LABEL' | translate }}</label>
                        <input type="text" class="w-full bg-[var(--fondo-secundario)] border-none p-3 rounded-3xl transition duration-300 outline-none focus:ring-2 focus:ring-[var(--primary)] placeholder:text-[var(--texto-secundario)]" [(ngModel)]="credencialesRegistro.username" name="regUsername" placeholder="{{ 'REGISTER.USERNAME_PLACEHOLDER' | translate }}">
                    </div>
                    <div class="mb-4 text-start">
                        <label class="font-bold text-muted small mb-1">{{ 'REGISTER.PASSWORD_LABEL' | translate }}</label>
                        <input type="password" class="w-full bg-[var(--fondo-secundario)] border-none p-3 rounded-3xl transition duration-300 outline-none focus:ring-2 focus:ring-[var(--primary)] placeholder:text-[var(--texto-secundario)]" [(ngModel)]="credencialesRegistro.password" name="regPassword" placeholder="{{ 'REGISTER.PASSWORD_PLACEHOLDER' | translate }}">
                    </div>
                    <button type="submit" class="w-full px-4 py-2 rounded-full font-bold bg-[var(--primary)] text-white shadow-sm transition hover:brightness-90">{{ 'REGISTER.BUTTON' | translate }}</button>
                </form>
            </div>
        </div>
    </div>
</header>
